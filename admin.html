<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    input, button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin: 5px 0;
    }

    input {
      width: min(100%, 350px);
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .aprovar {
      background: #28a745;
      color: white;
    }

    .rejeitar {
      background: #dc3545;
      color: white;
    }

    .card {
      background: #1d1d1d;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .status {
      font-weight: bold;
    }

    .pendente {
      color: #ffc107;
    }

    .aprovado {
      color: #4caf50;
    }

    .rejeitado {
      color: #f44336;
    }

    .comprovante {
      margin-top: 10px;
      padding: 10px;
      background: #111;
      border-radius: 10px;
    }

    .comprovante img {
      display: block;
      width: 100%;
      max-width: 500px;
      max-height: 600px;
      object-fit: contain;
      border-radius: 8px;
      margin-top: 8px;
    }

    .comprovante a {
      display: inline-block;
      margin-top: 8px;
      color: #7eb6ff;
      font-weight: bold;
    }

    #resultado {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Painel Administrativo</h1>

  <input
    type="password"
    id="adminKey"
    placeholder="Digite sua chave de administrador"
  >

  <br>

  <button onclick="carregar()">Carregar comprovantes</button>

  <div id="resultado"></div>

  <script>
    function mostrarComprovante(url) {
      if (!url) {
        return "<p>Nenhum comprovante enviado.</p>";
      }

      // Imagem em Base64
      if (url.startsWith("data:image/")) {
        return `
          <div class="comprovante">
            <strong>Comprovante:</strong>
            <img src="${url}" alt="Comprovante de pagamento">
          </div>
        `;
      }

      // PDF em Base64
      if (url.startsWith("data:application/pdf")) {
        return `
          <div class="comprovante">
            <strong>Comprovante PDF:</strong><br>
            <a href="${url}" target="_blank" rel="noopener">
              📄 Abrir comprovante PDF
            </a>
          </div>
        `;
      }

      // Caso seja uma URL normal
      if (
        url.startsWith("http://") ||
        url.startsWith("https://")
      ) {
        return `
          <div class="comprovante">
            <strong>Comprovante:</strong><br>
            <a href="${url}" target="_blank" rel="noopener">
              📎 Abrir comprovante
            </a>
          </div>
        `;
      }

      return `
        <div class="comprovante">
          <strong>Comprovante:</strong>
          <p>Formato não reconhecido.</p>
        </div>
      `;
    }

    async function carregar() {
      const key = document.getElementById("adminKey").value;
      const resultado = document.getElementById("resultado");

      if (!key) {
        resultado.innerHTML = "<p>Digite sua chave.</p>";
        return;
      }

      resultado.innerHTML = "<p>Carregando...</p>";

      try {
        const resposta = await fetch("/api/admin", {
          headers: {
            "x-admin-key": key
          }
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          resultado.innerHTML =
            `<p>${dados.error || "Erro"}</p>`;
          return;
        }

        if (!dados.comprovantes.length) {
          resultado.innerHTML =
            "<p>Nenhum comprovante encontrado.</p>";
          return;
        }

        resultado.innerHTML = dados.comprovantes.map(item => `
          <div class="card">

            <p>
              <strong>ID:</strong> ${item.id}
            </p>

            <p>
              <strong>Nome:</strong> ${item.nome}
            </p>

            <p>
              <strong>Código:</strong> ${item.codigo}
            </p>

            <p>
              <strong>Status:</strong>
              <span class="status ${item.status}">
                ${item.status}
              </span>
            </p>

            <p>
              <strong>Data:</strong> ${item.criado_em}
            </p>

            ${mostrarComprovante(item.comprovante_url)}

            ${
              item.status === "pendente"
                ? `
                  <button
                    class="aprovar"
                    onclick="alterarStatus(${item.id}, 'aprovado')"
                  >
                    Aprovar
                  </button>

                  <button
                    class="rejeitar"
                    onclick="alterarStatus(${item.id}, 'rejeitado')"
                  >
                    Rejeitar
                  </button>
                `
                : ""
            }

          </div>
        `).join("");

      } catch (erro) {
        console.error(erro);

        resultado.innerHTML =
          "<p>Erro ao conectar com o servidor.</p>";
      }
    }

    async function alterarStatus(id, status) {
      const key = document.getElementById("adminKey").value;

      if (!key) {
        alert("Digite sua chave de administrador.");
        return;
      }

      const confirmacao = confirm(
        status === "aprovado"
          ? "Deseja realmente APROVAR este comprovante?"
          : "Deseja realmente REJEITAR este comprovante?"
      );

      if (!confirmacao) {
        return;
      }

      try {
        const resposta = await fetch("/api/admin", {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "x-admin-key": key
          },
          body: JSON.stringify({
            id: id,
            status: status
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          alert(
            dados.error ||
            "Erro ao alterar status."
          );
          return;
        }

        alert(
          status === "aprovado"
            ? "Comprovante aprovado!"
            : "Comprovante rejeitado!"
        );

        carregar();

      } catch (erro) {
        alert("Erro ao conectar com o servidor.");
      }
    }
  </script>

</body>
</html>
