<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  margin: 0;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

input, select, button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  margin: 5px 0;
}

input, select {
  width: min(100%, 350px);
  box-sizing: border-box;
}

button {
  cursor: pointer;
  font-weight: bold;
}

.criar {
  background: #6f42c1;
  color: white;
}

.aprovar {
  background: #28a745;
  color: white;
}

.rejeitar {
  background: #dc3545;
  color: white;
}

.card {
  background: #1d1d1d;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
}

.codigo {
  background: #080808;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
  font-family: monospace;
  font-size: 20px;
  color: #7cff9b;
  word-break: break-all;
}

.status {
  font-weight: bold;
}

.pendente {
  color: #ffc107;
}

.aprovado {
  color: #4caf50;
}

.rejeitado {
  color: #f44336;
}

#resultado,
#codigoCriado {
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>Painel Administrativo</h1>

<input
  type="password"
  id="adminKey"
  placeholder="Chave de administrador"
>

<hr>

<h2>Criar código</h2>

<input
  type="text"
  id="nome"
  placeholder="Nome da pessoa"
>

<br>

<select id="dias">
  <option value="1">1 dia</option>
  <option value="7">7 dias</option>
  <option value="30">30 dias</option>
</select>

<br>

<button class="criar" onclick="criarCodigo()">
  CRIAR CÓDIGO
</button>

<div id="codigoCriado"></div>

<hr>

<h2>Comprovantes</h2>

<button onclick="carregar()">
  CARREGAR COMPROVANTES
</button>

<div id="resultado"></div>

<script>

async function criarCodigo() {

  const key = document.getElementById("adminKey").value;
  const nome = document.getElementById("nome").value.trim();
  const days = Number(document.getElementById("dias").value);
  const area = document.getElementById("codigoCriado");

  if (!key) {
    area.innerHTML = "<p>Digite sua chave de administrador.</p>";
    return;
  }

  if (!nome) {
    area.innerHTML = "<p>Digite o nome da pessoa.</p>";
    return;
  }

  area.innerHTML = "<p>Criando código...</p>";

  try {

    const resposta = await fetch("/api/admin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": key
      },
      body: JSON.stringify({
        nome: nome,
        days: days
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      area.innerHTML =
        `<p style="color:#ff5555">${dados.error || "Erro ao criar código."}</p>`;
      return;
    }

    area.innerHTML = `
      <div class="card">
        <strong>CÓDIGO CRIADO!</strong>

        <div class="codigo">
          ${dados.codigo.codigo}
        </div>

        <p>
          Nome: ${dados.codigo.nome}<br>
          Validade: ${dados.codigo.days} dia(s)<br>
          Expira em: ${dados.codigo.expires_at}
        </p>

        <button onclick="copiarCodigo('${dados.codigo.codigo}')">
          COPIAR CÓDIGO
        </button>
      </div>
    `;

    document.getElementById("nome").value = "";

    carregar();

  } catch (erro) {

    area.innerHTML =
      "<p style='color:#ff5555'>Erro ao conectar com o servidor.</p>";
  }
}


async function copiarCodigo(codigo) {

  try {

    await navigator.clipboard.writeText(codigo);

    alert("Código copiado!");

  } catch {

    alert("Não foi possível copiar automaticamente.");
  }
}


async function carregar() {

  const key = document.getElementById("adminKey").value;
  const resultado = document.getElementById("resultado");

  if (!key) {
    resultado.innerHTML =
      "<p>Digite sua chave de administrador.</p>";
    return;
  }

  resultado.innerHTML = "<p>Carregando...</p>";

  try {

    const resposta = await fetch("/api/admin", {
      headers: {
        "x-admin-key": key
      }
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      resultado.innerHTML =
        `<p>${dados.error || "Erro"}</p>`;
      return;
    }

    if (!dados.comprovantes.length) {
      resultado.innerHTML =
        "<p>Nenhum registro encontrado.</p>";
      return;
    }

    resultado.innerHTML =
      dados.comprovantes.map(item => `

        <div class="card">

          <p>
            <strong>ID:</strong> ${item.id}
          </p>

          <p>
            <strong>Nome:</strong> ${item.nome}
          </p>

          <p>
            <strong>Código:</strong> ${item.codigo}
          </p>

          <p>
            <strong>Período:</strong>
            ${item.days || "-"} dia(s)
          </p>

          <p>
            <strong>Status:</strong>

            <span class="status ${item.status}">
              ${item.status}
            </span>
          </p>

          <p>
            <strong>Expira:</strong>
            ${item.expires_at || "-"}
          </p>

          ${
            item.status === "pendente"
              ? `

                <button
                  class="aprovar"
                  onclick="alterarStatus(${item.id}, 'aprovado')"
                >
                  APROVAR
                </button>

                <button
                  class="rejeitar"
                  onclick="alterarStatus(${item.id}, 'rejeitado')"
                >
                  REJEITAR
                </button>

              `
              : ""
          }

        </div>

      `).join("");

  } catch {

    resultado.innerHTML =
      "<p>Erro ao conectar com o servidor.</p>";
  }
}


async function alterarStatus(id, status) {

  const key = document.getElementById("adminKey").value;

  if (!key) {
    alert("Digite sua chave de administrador.");
    return;
  }

  const confirmacao = confirm(
    status === "aprovado"
      ? "Deseja APROVAR?"
      : "Deseja REJEITAR?"
  );

  if (!confirmacao) return;

  try {

    const resposta = await fetch("/api/admin", {
      method: "PATCH",

      headers: {
        "Content-Type": "application/json",
        "x-admin-key": key
      },

      body: JSON.stringify({
        id: id,
        status: status
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {

      alert(
        dados.error ||
        "Erro ao alterar status."
      );

      return;
    }

    alert(
      status === "aprovado"
        ? "Comprovante aprovado!"
        : "Comprovante rejeitado!"
    );

    carregar();

  } catch {

    alert(
      "Erro ao conectar com o servidor."
    );
  }
}

</script>

</body>
</html>
