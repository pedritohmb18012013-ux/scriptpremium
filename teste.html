<!DOCTYPE html>
<html lang="pt-BR">
<body>
  <button onclick="testar()">Testar envio</button>

  <script>
    async function testar() {
      const resposta = await fetch("/api/upload", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: "Teste",
          code: "TESTE-001",
          proof: "teste"
        })
      });

      const resultado = await resposta.json();
      alert(JSON.stringify(resultado));
    }
  </script>
</body>
</html>
